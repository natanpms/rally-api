name: rally-api

services:
    postgres:
        image: postgres:18-alpine
        container_name: rally-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-rally_api}
            POSTGRES_USER: ${DB_USERNAME:-rally}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            # Published on the host so local tooling (psql, TablePlus, host artisan)
            # can connect. Defaults to 5433 to avoid a host PostgreSQL on 5432.
            - '${FORWARD_DB_PORT:-5433}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready --username=${DB_USERNAME:-rally} --dbname=${DB_DATABASE:-rally_api}
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        networks:
            - rally

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: rally-api-app
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy

        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - .:/var/www/html
        networks:
            - rally

    # Roda `tennis:sync-rankings` toda terça; sem ele o ranking nunca entra no
    # banco. As migrations ficam a cargo do container `api`.
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: rally-scheduler
        restart: unless-stopped
        environment:
            RUN_MIGRATIONS: 'false'
        depends_on:
            postgres:
                condition: service_healthy
        command: ['php', 'artisan', 'schedule:work']
        volumes:
            - .:/var/www/html
        networks:
            - rally

volumes:
    postgres-data:
        driver: local

networks:
    rally:
        driver: bridge
